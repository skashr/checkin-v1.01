<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日打卡</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#fff; --border:#e6e8ec; --text:#1f2430; --muted:#7b8494;
  --primary:#4f8cff; --primary-weak:#eaf1ff; --green:#1f9d55; --green-weak:#e6f7ee;
  --green-deep:#157347; --red:#d94a4a; --red-weak:#fdeaea; --amber:#c47f10;
  --shadow:0 1px 2px rgba(20,24,34,.06),0 4px 16px rgba(20,24,34,.06);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;font-size:14px}
.hidden{display:none!important}

.topbar{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--border);flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;white-space:nowrap}
.tabs{display:flex;gap:4px;background:var(--bg);border-radius:8px;padding:3px}
.tab{border:none;background:transparent;color:var(--muted);padding:6px 15px;border-radius:6px}
.tab.active{background:var(--panel);color:var(--primary);font-weight:600;box-shadow:var(--shadow)}
.spacer{flex:1}
.btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:7px 14px}
.btn:hover{filter:brightness(.97)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.btn.primary:hover{filter:brightness(1.05)}
.btn.danger{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted)}
.btn:disabled{opacity:.5;cursor:not-allowed}

.main{max-width:1080px;margin:0 auto;padding:20px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow);padding:18px}
.view-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.view-title{font-size:18px;font-weight:700}
.nav-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--panel);font-size:14px}
.nav-btn:hover{background:var(--bg)}
.hint{color:var(--muted);font-size:13px}

.summary{display:flex;align-items:center;gap:16px;padding:12px 14px;background:var(--bg);border-radius:8px;margin-bottom:14px;flex-wrap:wrap}
.summary .rate{font-weight:700;font-size:15px}
.streak{color:var(--amber);font-weight:600}
.score{color:var(--amber);font-weight:700;font-size:15px;white-space:nowrap}
.score-badge{font-size:12px;padding:2px 8px;border-radius:999px;background:#fff4e0;color:#a8700a;white-space:nowrap;flex:none}
.progress{flex:1;min-width:120px;height:8px;background:var(--border);border-radius:4px;overflow:hidden}
.progress>span{display:block;height:100%;background:var(--green);border-radius:4px;transition:width .2s}

.task-list{display:flex;flex-direction:column;gap:10px}
.task-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--border);border-left:4px solid var(--primary);border-radius:8px;background:var(--panel);position:relative}
.task-dot{width:12px;height:12px;border-radius:50%;flex:none}
.task-name{flex:1;font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toggle{width:56px;height:56px;border-radius:12px;border:2px solid transparent;font-size:26px;display:flex;align-items:center;justify-content:center;flex:none;transition:transform .08s,background .12s}
.toggle:active{transform:scale(.94)}
.toggle.done{background:var(--green-weak);border-color:var(--green)}
.toggle.miss{background:var(--red-weak);border-color:var(--red)}
.toggle:disabled{cursor:not-allowed;opacity:.55}
.row-menu{border:none;background:transparent;color:var(--muted);font-size:18px;width:30px;height:30px;border-radius:6px}
.row-menu:hover{background:var(--bg)}
.menu-pop{position:absolute;right:12px;top:50px;background:var(--panel);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow);z-index:20;display:flex;flex-direction:column;min-width:120px;overflow:hidden}
.menu-pop button{border:none;background:transparent;text-align:left;padding:9px 14px}
.menu-pop button:hover{background:var(--bg)}
.menu-pop button.danger{color:var(--red)}

.empty{text-align:center;color:var(--muted);padding:48px 16px}
.empty .big{font-size:40px;margin-bottom:8px}
.avatar-sm{width:28px;height:28px;border-radius:50%;object-fit:cover;vertical-align:middle;margin-right:6px;flex:none}
.avatar-big{width:96px;height:96px;border-radius:50%;object-fit:cover;margin-bottom:10px}

.week-table{width:100%;border-collapse:collapse;table-layout:fixed}
.week-table th,.week-table td{border:1px solid var(--border);padding:6px 4px;text-align:center;font-size:14px}
.week-table th{background:var(--bg);font-weight:600}
.week-table .name-col{text-align:left;width:22%;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.week-table .na{color:#c4cad2}
.week-table .cell{cursor:pointer}
.week-table .cell:hover{background:var(--primary-weak)}
.week-day-header{cursor:pointer}
.week-day-header:hover{color:var(--primary)}
.week-day-sub{display:block;font-size:11px;color:var(--muted);font-weight:400}
.week-footer{margin-top:12px;color:var(--muted);font-size:13px}

.month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.month-weekday{text-align:center;color:var(--muted);font-size:12px;padding:4px 0}
.mcell{aspect-ratio:1/1;border-radius:8px;border:1px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;cursor:pointer;transition:transform .08s;min-height:44px}
.mcell:hover:not(.future):not(.blank){transform:scale(1.04)}
.mcell .mday{font-weight:600}
.mcell .msub{font-size:11px;opacity:.9}
.mcell.done{background:var(--green-deep);color:#fff}
.mcell.partial{background:#bfe8ce;color:#155a33}
.mcell.miss{background:#f6c2c2;color:#8f2424}
.mcell.none{background:#eef0f3;color:#a2a9b4;cursor:default}
.mcell.future{background:#fafbfc;color:#c4cad2;cursor:not-allowed;border:1px dashed var(--border)}
.mcell.blank{cursor:default;visibility:hidden}
.mcell.today{outline:2px solid var(--primary);outline-offset:-2px}
.month-legend{display:flex;gap:14px;margin-top:12px;flex-wrap:wrap;color:var(--muted);font-size:13px;align-items:center}
.legend-item{display:inline-flex;align-items:center;gap:6px}
.legend-swatch{width:14px;height:14px;border-radius:4px;display:inline-block}
.legend-swatch.done{background:var(--green-deep)}
.legend-swatch.partial{background:#bfe8ce}
.legend-swatch.miss{background:#f6c2c2}
.legend-swatch.none{background:#eef0f3}
.legend-swatch.future{background:#fafbfc;border:1px dashed var(--border)}

.manage-row{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px;background:var(--panel)}
.manage-row.disabled{opacity:.6}
.badge{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--muted);white-space:nowrap}

.switch{position:relative;width:40px;height:22px;border-radius:999px;background:var(--border);border:none;transition:background .15s;flex:none}
.switch::after{content:"";position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .15s}
.switch.on{background:var(--green)}
.switch.on::after{transform:translateX(18px)}

.setting-block{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--border)}
.setting-block:last-child{border-bottom:none}
.setting-label{flex:1}
.setting-label .title{font-weight:600}
.setting-label .desc{color:var(--muted);font-size:13px}
.input{border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:14px;font-family:inherit;background:var(--panel);color:var(--text)}
.input:focus{outline:2px solid var(--primary-weak);border-color:var(--primary)}
.mono{font-family:Consolas,"Courier New",monospace;font-size:12px;color:var(--muted);word-break:break-all}
.settings-msg{margin-top:12px;padding:10px 12px;border-radius:8px;background:var(--primary-weak);color:#2c5282;font-size:13px;word-break:break-all}
.settings-msg.error{background:var(--red-weak);color:#8f2424}

.overlay{position:fixed;inset:0;background:rgba(20,24,34,.4);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:var(--panel);border-radius:14px;box-shadow:0 10px 40px rgba(20,24,34,.25);width:100%;max-width:420px;padding:20px}
.modal h3{margin:0 0 6px}
.modal .desc{color:var(--muted);font-size:13px;margin:0 0 16px}
.modal .field{margin-bottom:14px}
.modal .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.modal .field .input{width:100%}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatch{width:30px;height:30px;border-radius:8px;border:2px solid transparent;cursor:pointer}
.swatch.selected{border-color:var(--text);box-shadow:0 0 0 2px #fff inset}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.error-text{color:var(--red);font-size:13px;min-height:18px}
.banner{background:#fff8e6;border:1px solid #f0dca0;color:#8a6d1a;padding:8px 12px;border-radius:8px;font-size:13px;margin-bottom:12px}
@media(max-width:720px){.main{padding:12px}.toggle{width:48px;height:48px;font-size:22px}.week-table th,.week-table td{padding:4px 2px;font-size:12px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="overlay" class="overlay hidden"></div>
<input type="file" id="importFile" accept="application/json,.json" style="display:none">

<script>
(function(){
"use strict";

/* ============ 运行环境 & 存储适配 ============ */
// 桌面版（Tauri EXE）：数据存为 JSON 文件（可放网盘同步目录）
// 网页版（双击 html）：数据存 localStorage
var isTauri = !!(window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.invoke);
function tauriInvoke(cmd, args){ return window.__TAURI_INTERNALS__.invoke(cmd, args || {}); }

/* ============ 基础工具 ============ */
function pad(n){return String(n).padStart(2,'0');}
function uid(){return (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : ('id-'+Date.now()+'-'+Math.random().toString(36).slice(2));}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function normScore(v){var s=parseInt(v,10);return (isFinite(s)&&s>=1)?s:10;}

/* ============ 持久化 ============ */
var KEYS={tasks:'dc_tasks_v1',checkins:'dc_checkins_v1',settings:'dc_settings_v1'};
var storageOK=true;
function lsGet(k,d){try{var v=localStorage.getItem(k);return v==null?d:JSON.parse(v);}catch(e){storageOK=false;return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){storageOK=false;}}

var state={
  tasks: (lsGet(KEYS.tasks, [])||[]).map(function(t){t.score=normScore(t.score);return t;}),
  checkins: lsGet(KEYS.checkins, {}),
  settings: Object.assign({reminderEnabled:false, reminderTime:'20:00', lastReminderDate:''}, lsGet(KEYS.settings, {}))
};

function applyData(d){
  state.tasks = (Array.isArray(d.tasks) ? d.tasks : []).map(function(t){t.score=normScore(t.score);return t;});
  state.checkins = (d.checkins && typeof d.checkins==='object') ? d.checkins : {};
  state.settings = Object.assign({reminderEnabled:false, reminderTime:'20:00', lastReminderDate:''}, d.settings||{});
}

function save(){
  lsSet(KEYS.tasks, state.tasks);
  lsSet(KEYS.checkins, state.checkins);
  lsSet(KEYS.settings, state.settings);
  if(isTauri){
    var payload = {tasks: state.tasks, checkins: state.checkins, settings: state.settings};
    tauriInvoke('save_data', {data: JSON.stringify(payload)}).catch(function(e){ console.error('save_data', e); });
  }
}

/* ============ 日期工具（本地时区） ============ */
function toDateStr(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function parseDate(s){var a=s.split('-').map(Number);return new Date(a[0],a[1]-1,a[2]);}
function todayStr(){return toDateStr(new Date());}
function addDays(s,n){var d=parseDate(s);d.setDate(d.getDate()+n);return toDateStr(d);}
function mondayOf(s){var d=parseDate(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return toDateStr(d);}
function addMonths(y,m,delta){var idx=y*12+(m-1)+delta;return {year:Math.floor(idx/12),month:(idx%12)+1};}
function daysInMonth(y,m){return new Date(y,m,0).getDate();}
var WEEKDAYS=['周日','周一','周二','周三','周四','周五','周六'];
function weekdayLabel(s){return WEEKDAYS[parseDate(s).getDay()];}
function fullCN(s){var d=parseDate(s);return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日';}

/* ============ 统计口径 ============ */
function bySort(a,b){return (a.sortOrder-b.sortOrder) || (a.createdAt<b.createdAt?-1:1) || (a.id<b.id?-1:1);}
function applicableTasks(date){return state.tasks.filter(function(t){return t.enabled && t.createdAt<=date;}).sort(bySort);}
function allEnabledTasks(){return state.tasks.filter(function(t){return t.enabled;}).sort(bySort);}
function statusOf(tid,date){var v=state.checkins[tid+'|'+date];return (v===1)?1:0;}
function isMarked(tid,date){return state.checkins.hasOwnProperty(tid+'|'+date);}
function dayStats(date){
  var today=todayStr();
  var future=date>today;
  var tasks=applicableTasks(date);
  var list=tasks.map(function(t){
    var st=statusOf(t.id,date);
    return {id:t.id,name:t.name,color:t.color,score:t.score,status:st,marked:isMarked(t.id,date)};
  });
  var done=list.filter(function(x){return x.status===1;}).length;
  var score=list.filter(function(x){return x.status===1;}).reduce(function(a,x){return a+x.score;},0);
  var hasAnyMark=list.some(function(x){return x.marked;});
  return {date:date,isToday:date===today,isFuture:future,tasks:list,done:done,score:score,total:list.length,rate:list.length?(done/list.length):0,hasAnyMark:hasAnyMark};
}
function fullyComplete(date){
  var a=applicableTasks(date);
  if(!a.length) return false;
  return a.every(function(t){return statusOf(t.id,date)===1;});
}
function computeStreak(){
  var t=todayStr();
  var start=fullyComplete(t)?t:addDays(t,-1);
  var streak=0,d=start;
  while(fullyComplete(d)){streak++;d=addDays(d,-1);if(streak>100000)break;}
  return streak;
}
function weekView(monday){
  var days=[];for(var i=0;i<7;i++)days.push(addDays(monday,i));
  var sunday=days[6];
  var tasks=allEnabledTasks();
  var totalScore=0;
  var rows=tasks.map(function(t){
    var created=t.createdAt;
    var doneDays=0;
    var rowScore=0;
    var cells=days.map(function(d){
      if(d<created)return -1;
      var s=statusOf(t.id,d);if(s===1){doneDays++;rowScore+=t.score;}
      return s;
    });
    totalScore+=rowScore;
    return {task:t,cells:cells,doneDays:doneDays,score:rowScore};
  });
  var totalDone=rows.reduce(function(a,r){return a+r.doneDays;},0);
  var totalCells=rows.length*7;
  return {monday:monday,sunday:sunday,days:days,rows:rows,totalDone:totalDone,totalCells:totalCells,totalScore:totalScore,rate:totalCells?(totalDone/totalCells):0};
}
function monthView(year,month){
  var today=todayStr();
  var daysInM=daysInMonth(year,month);
  var tasks=allEnabledTasks();
  var days=[];
  var doneTotal=0,totalTotal=0,scoreTotal=0;
  for(var d=1;d<=daysInM;d++){
    var date=year+'-'+pad(month)+'-'+pad(d);
    if(date>today){
      days.push({date:date,status:'future',done:0,total:0,score:0});
    }else{
      var app=tasks.filter(function(t){return t.createdAt<=date;});
      if(!app.length){days.push({date:date,status:'none',done:0,total:0,score:0});}
      else{
        var doneT=app.filter(function(t){return statusOf(t.id,date)===1;});
        var done=doneT.length;
        var total=app.length;
        var dayScore=doneT.reduce(function(a,t){return a+t.score;},0);
        var status=(done===total)?'done':(done>0?'partial':'miss');
        doneTotal+=done;totalTotal+=total;scoreTotal+=dayScore;
        days.push({date:date,status:status,done:done,total:total,score:dayScore});
      }
    }
  }
  return {year:year,month:month,days:days,done:doneTotal,total:totalTotal,score:scoreTotal,rate:totalTotal?(doneTotal/totalTotal):0,streak:computeStreak()};
}

/* ============ 视图状态 ============ */
var view='day';
var dayDate=todayStr();
var weekStart=mondayOf(todayStr());
var now=new Date();
var monthCursor={year:now.getFullYear(),month:now.getMonth()+1};
var openMenuId=null;
var currentDataDir='';
var autostartOn=false;

/* ============ 渲染 ============ */
var app=document.getElementById('app');
function pct(v){return Math.round(v*100);}

function render(){
  var html='';

function renderDay(){
  var d=dayStats(dayDate);
  var today=todayStr();
  var h='';
  h+='<div class="view-head">'
    +'<button class="nav-btn" data-act="day-prev">‹</button>'
    +'<div class="view-title">'+fullCN(dayDate)+' · '+weekdayLabel(dayDate)+(d.isToday?' <span class="hint">（今天）</span>':'')+'</div>'
    +'<button class="nav-btn" data-act="day-next">›</button>'
    +(d.isToday?'':'<button class="btn" data-act="day-today">回到今天</button>')
    +'</div>';
  h+='<div class="summary"><span class="rate">'+(d.total?d.done+' / '+d.total:'—')+'</span>'

  h+='<div class="view-head">'

    +'</div>';
  h+='<div class="summary"><span class="rate">本月完成率 '+pct(mv.rate)+'%</span>'

  for(var i=0;i<lead;i++)h+='<div class="mcell blank"></div>';
  mv.days.forEach(function(d){
    var dayNum=Number(d.date.slice(8));
    var clickable=d.status!=='future';
    var cls='mcell '+d.status+(d.date===today?' today':'');
    var title=d.status==='future'?'未来日期不可打卡':(d.date+'：'+(d.status==='none'?'无任务':d.done+'/'+d.total+' 完成'));

  return h;
}

function openTaskDialog(initial){

    +'<div class="field"><label>分值（完成后加多少分）</label><input class="input" type="number" id="taskScore" min="1" step="1" value="'+esc(initial?initial.score:10)+'"></div>'
    +'<div class="field"><label>颜色</label><div class="swatches" id="swatches">';
  colors.forEach(function(c){h+='<button class="swatch'+(c===selectedColor?' selected':'')+'" style="background:'+c+'" data-color="'+c+'"></button>';});
  h+='</div></div><div class="error-text" id="taskErr"></div>'
    +'<div class="modal-actions"><button class="btn" data-act="dlg-cancel">取消</button><button class="btn primary" data-act="dlg-save" data-id="'+esc(initial?initial.id:'')+'">保存</button></div></div>';
  openOverlay(h);
  var inp=document.getElementById('taskName');inp.focus();
}

function openConfirm(title,message,confirmLabel,danger,onOk){
  var h='<div class="modal"><h3>'+esc(title)+'</h3><p class="desc" style="white-space:pre-wrap">'+esc(message)+'</p>'
    +'<div class="modal-actions"><button class="btn" data-act="confirm-cancel">取消</button><button class="btn '+(danger?'danger':'primary')+'" data-act="confirm-ok">'+esc(confirmLabel||'确定')+'</button></div></div>';
  openOverlay(h);
  overlay._onOk=onOk;
}

/* ============ 动作处理 ============ */
function findTask(id){return state.tasks.find(function(t){return t.id===id;});}
function nextSortOrder(){return state.tasks.reduce(function(m,t){return Math.max(m,t.sortOrder);},0)+1;}

function setCheckin(id,date,status){
  if(date!==todayStr())return;
  state.checkins[id+'|'+date]=status;
  save();render();
}
function createTask(name,color,score){
  var t={id:uid(),name:name,color:color,score:normScore(score),enabled:true,sortOrder:nextSortOrder(),createdAt:todayStr()};
  state.tasks.push(t);save();render();
}
function updateTask(id,name,color,score){
  var t=findTask(id);if(!t)return;
  t.name=name;t.color=color;t.score=normScore(score);save();render();
}
function deleteTask(id){
  var t=findTask(id);if(!t)return;
  state.tasks=state.tasks.filter(function(x){return x.id!==id;});
  Object.keys(state.checkins).forEach(function(k){if(k.indexOf(id+'|')===0)delete state.checkins[k];});
  save();render();
}
function toggleEnabled(id){
  var t=findTask(id);if(!t)return;
  t.enabled=!t.enabled;save();render();
}

function exportBackup(){
  var data={app:'daily-checkin',version:1,exportedAt:new Date().toISOString(),tasks:state.tasks,checkins:state.checkins,settings:state.settings};
  var blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  a.href=url;a.download='每日打卡备份-'+todayStr()+'.json';
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},2000);
  showMsg('已导出备份文件。');
}
function importBackup(){
  document.getElementById('importFile').click();
}
function showMsg(text,isError){
  var el=document.getElementById('settingsMsg');
  if(el){el.innerHTML='<div class="settings-msg'+(isError?' error':'')+'">'+esc(text)+'</div>';}
}

function pickDataDir(){
  if(!isTauri)return;
  tauriInvoke('pick_data_dir').then(function(dir){
    if(!dir)return;
    return tauriInvoke('set_data_dir',{dir:dir}).then(function(){
      currentDataDir=dir;
      return tauriInvoke('load_data').then(function(json){
        if(json){try{applyData(JSON.parse(json));}catch(e){}}
        save();render();
      });
    });
  }).catch(function(e){console.error(e);});
}

function handleAction(el,e){
  var act=el.getAttribute('data-act');
  if(act==='nav'){var v=el.getAttribute('data-view');
    if(v==='week')weekStart=mondayOf(dayDate);
    if(v==='month'){var dd=parseDate(dayDate);monthCursor={year:dd.getFullYear(),month:dd.getMonth()+1};}
    view=v;openMenuId=null;render();return;
  }
  if(act==='add'){openTaskDialog(null);return;}
  if(act==='day-prev'){dayDate=addDays(dayDate,-1);openMenuId=null;render();return;}
  if(act==='day-next'){dayDate=addDays(dayDate,1);openMenuId=null;render();return;}
  if(act==='day-today'){dayDate=todayStr();openMenuId=null;render();return;}
  if(act==='week-prev'){weekStart=addDays(weekStart,-7);render();return;}
  if(act==='week-next'){weekStart=addDays(weekStart,7);render();return;}
  if(act==='week-today'){weekStart=mondayOf(todayStr());render();return;}
  if(act==='month-prev'){monthCursor=addMonths(monthCursor.year,monthCursor.month,-1);render();return;}
  if(act==='month-next'){monthCursor=addMonths(monthCursor.year,monthCursor.month,1);render();return;}
  if(act==='goto'){dayDate=el.getAttribute('data-date');view='day';openMenuId=null;render();return;}

  if(act==='toggle'){var id=el.getAttribute('data-id');var cur=statusOf(id,dayDate);setCheckin(id,dayDate,cur===1?0:1);return;}
  if(act==='menu'){var mid=el.getAttribute('data-id');openMenuId=(openMenuId===mid)?null:mid;render();return;}
  if(act==='edit'){var t=findTask(el.getAttribute('data-id'));if(t)openTaskDialog(t);return;}
  if(act==='disable'){toggleEnabled(el.getAttribute('data-id'));return;}
  if(act==='toggle-enabled'){toggleEnabled(el.getAttribute('data-id'));return;}
  if(act==='delete'){
    var dId=el.getAttribute('data-id');var dt=findTask(dId);
    openConfirm('删除任务','将删除任务「'+dt.name+'」及其全部历史打卡记录（级联删除），此操作不可恢复。\n确定删除吗？','删除',true,function(){deleteTask(dId);});
    return;
  }

  if(act==='dlg-cancel'){closeOverlay();return;}
  if(act==='dlg-save'){
    var nameEl=document.getElementById('taskName');
    var name=(nameEl.value||'').trim();
    if(!name){document.getElementById('taskErr').textContent='任务名称不能为空';return;}
    var scoreEl=document.getElementById('taskScore');
    var score=parseInt(scoreEl&&scoreEl.value,10);
    if(!isFinite(score)||score<1){document.getElementById('taskErr').textContent='分值需要是大于 0 的整数';return;}
    var id=el.getAttribute('data-id');
    if(id){updateTask(id,name,selectedColor,score);}else{createTask(name,selectedColor,score);}
    closeOverlay();return;
  }
  if(act==='confirm-cancel'){closeOverlay();return;}
  if(act==='confirm-ok'){var fn=overlay._onOk;closeOverlay();if(fn)fn();return;}

  if(act==='toggle-reminder'){
    var btn=document.getElementById('setReminderBtn');
    state.settings.reminderEnabled=!state.settings.reminderEnabled;
    if(btn)btn.classList.toggle('on',state.settings.reminderEnabled);
    if(state.settings.reminderEnabled)requestNotifyPerm();
    return;
  }
  if(act==='save-settings'){
    var timeEl=document.getElementById('setTime');
    state.settings.reminderTime=(timeEl&&timeEl.value)?timeEl.value:'20:00';
    save();
    if(state.settings.reminderEnabled)requestNotifyPerm();
    showMsg('设置已保存。');
    return;
  }
  if(act==='toggle-autostart'){
    autostartOn=!autostartOn;
    var ab=document.getElementById('autoBtn');if(ab)ab.classList.toggle('on',autostartOn);
    if(isTauri)tauriInvoke('set_autostart',{enabled:autostartOn}).catch(function(e){console.error(e);});
    return;
  }
  if(act==='pick-dir'){pickDataDir();return;}
  if(act==='export'){exportBackup();return;}
  if(act==='import'){importBackup();return;}
}

/* 颜色选择 + 事件委托 */
document.addEventListener('click',function(e){
  var sw=e.target.closest('.swatch');
  if(sw){selectedColor=sw.getAttribute('data-color');var all=document.querySelectorAll('.swatch');all.forEach(function(s){s.classList.toggle('selected',s===sw);});return;}
  var el=e.target.closest('[data-act]');
  if(!el)return;
  handleAction(el,e);
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter' && !overlay.classList.contains('hidden')){
    var nameEl=document.getElementById('taskName');
    if(nameEl && document.activeElement===nameEl){
      var saveBtn=overlay.querySelector('[data-act="dlg-save"]');
      if(saveBtn)handleAction(saveBtn,e);
    }
  }
  if(e.key==='Escape' && !overlay.classList.contains('hidden')){closeOverlay();}
});

/* 导入文件 */
document.getElementById('importFile').addEventListener('change',function(e){
  var file=e.target.files[0];e.target.value='';
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(){
    try{
      var data=JSON.parse(reader.result);
      if(!data || !Array.isArray(data.tasks) || typeof data.checkins!=='object'){
        showMsg('导入失败：文件格式不正确。',true);return;
      }
      lsSet('dc_backup_before_import_'+Date.now(),{tasks:state.tasks,checkins:state.checkins,settings:state.settings});
      applyData(data);
      save();render();
      showMsg('导入成功。原数据已自动备份。');
    }catch(err){showMsg('导入失败：'+err.message,true);}
  };
  reader.readAsText(file);
});

/* ============ 每日提醒 ============ */
function requestNotifyPerm(){
  if(!('Notification' in window))return;
  if(Notification.permission==='default'){try{Notification.requestPermission();}catch(e){}}
}
setInterval(function(){
  var s=state.settings;
  if(!s.reminderEnabled)return;
  if(!('Notification' in window) || Notification.permission!=='granted')return;
  var now=new Date();
  var hhmm=pad(now.getHours())+':'+pad(now.getMinutes());
  var today=todayStr();
  if(hhmm===s.reminderTime && s.lastReminderDate!==today){
    s.lastReminderDate=today;save();
    try{new Notification('每日打卡',{body:'今天还没打卡，别忘了哦！'});}catch(e){}
  }
},20000);

/* ============ 初始化 ============ */
function bootstrap(){
  if(isTauri){
    Promise.all([
      tauriInvoke('load_data'),
      tauriInvoke('get_data_dir'),
      tauriInvoke('get_autostart')
    ]).then(function(res){
      var json=res[0];
      if(json){try{applyData(JSON.parse(json));}catch(e){}}
      currentDataDir=res[1]||'';
      autostartOn=!!res[2];
      render();
    }).catch(function(e){console.error(e);render();});
  }else{
    render();
  }
}
bootstrap();
})();
</script>
</body>
</html>
